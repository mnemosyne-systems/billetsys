# Security Configuration
quarkus.security.users.embedded.enabled=false

# Public endpoints (no authentication required)
quarkus.http.auth.permission.public.paths=/api/public/*,/api/app/session,/api/cap/*,/health/*,/metrics
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.priority=1

# Authenticated endpoints
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.auth.permission.authenticated.priority=2

quarkus.log.category."io.quarkus.oidc".level=DEBUG
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.level=INFO

# Application data cache (https://quarkus.io/guides/cache/).
# Phase 1: "branding" holds the installation-wide BrandingSnapshot DTO (single
# entry, no company scoping needed). Phase 2 adds company-scoped caches.
quarkus.cache.caffeine."branding".maximum-size=16
quarkus.cache.caffeine."branding".expire-after-write=10M

# Report snapshots keyed by resolved scope ("all", "company:<id>", "user:<id>")
# plus period. Targeted per-company invalidation is deliberately NOT done
# here: keys embed user scopes, so a ticket/message write cannot enumerate the
# affected keys. Writers therefore evict everything (see
# ReportService.invalidateAll, called from the EventService ticket methods and
# TicketAutoCloseService), and the short TTL below bounds anything missed
# (e.g. a future writer that forgets to hook in). Correctness over cache
# efficiency, by design — do not "fix" the evict-all without rethinking the
# key design first.
quarkus.cache.caffeine."report-snapshots".maximum-size=500
quarkus.cache.caffeine."report-snapshots".expire-after-write=5M

# Directory listings: per-actor company sets and per-company user entries.
# Targeted invalidation on user/company/membership writes (see
# DirectoryService); TTL is backstop only.
quarkus.cache.caffeine."directory-companies".maximum-size=2000
quarkus.cache.caffeine."directory-companies".expire-after-write=10M
quarkus.cache.caffeine."directory-users".maximum-size=1000
quarkus.cache.caffeine."directory-users".expire-after-write=10M

# Ticket bootstrap option lists. Entitlement options exist in two order
# contracts (workbench vs role forms) over the same rows; both invalidate on
# company-entitlement writes. Global lists are single entries. TTLs backstop
# any missed admin write.
quarkus.cache.caffeine."bootstrap-entitlements".maximum-size=1000
quarkus.cache.caffeine."bootstrap-entitlements".expire-after-write=10M
quarkus.cache.caffeine."bootstrap-entitlements-ordered".maximum-size=1000
quarkus.cache.caffeine."bootstrap-entitlements-ordered".expire-after-write=10M
quarkus.cache.caffeine."bootstrap-versions".maximum-size=2000
quarkus.cache.caffeine."bootstrap-versions".expire-after-write=10M
quarkus.cache.caffeine."bootstrap-categories".maximum-size=16
quarkus.cache.caffeine."bootstrap-categories".expire-after-write=60M
quarkus.cache.caffeine."bootstrap-companies".maximum-size=64
quarkus.cache.caffeine."bootstrap-companies".expire-after-write=10M

# Hibernate second-level cache. Quarkus enables it by default and already
# bundles a suitable (Caffeine/JCache based) implementation with the
# hibernate-orm extension, so entities only need @Cacheable. Made explicit
# here so the intent is visible; per-region sizing below keeps the small,
# rarely-written reference tables bounded.
quarkus.hibernate-orm.second-level-caching-enabled=true
quarkus.hibernate-orm.cache."ai.mnemosyne_systems.model.Country".memory.object-count=512
quarkus.hibernate-orm.cache."ai.mnemosyne_systems.model.Timezone".memory.object-count=2048
quarkus.hibernate-orm.cache."ai.mnemosyne_systems.model.Category".memory.object-count=512
quarkus.hibernate-orm.cache."ai.mnemosyne_systems.model.Level".memory.object-count=512
quarkus.hibernate-orm.cache."ai.mnemosyne_systems.model.Entitlement".memory.object-count=512
